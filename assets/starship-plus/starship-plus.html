*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Outfit,system-ui,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:2px solid #fff;outline-offset:2px}
#side{position:fixed;left:0;top:0;bottom:0;width:72px;display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:20px;z-index:30;background:linear-gradient(90deg,#000b,transparent)}
.ib{background:none;border:0;color:#a0a0b0;width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{color:#fff}.ib.on{color:#fff;background:#ffffff1f}
#av{width:40px;height:40px;border-radius:50%;border:2px solid #fff3;background:linear-gradient(135deg,var(--ac),#f472b6);font-weight:700;font-size:17px;margin-bottom:6px}.profile-actions{display:flex;align-items:center;justify-content:center;gap:3px;margin-bottom:6px;min-width:0}#av{width:34px;height:34px;min-width:34px;flex:0 0 34px;margin:0;padding:0;border-radius:50%;font-size:15px}#av .profile-glyph{font-size:18px;line-height:1}#home-shortcut{width:34px;height:34px;min-width:34px;flex:0 0 34px;padding:0;font-size:17px;line-height:1;color:#e9e4ff;border:1px solid #ffffff24;background:#ffffff10;margin:0}#home-shortcut:hover{background:#ffffff25;color:#fff}.profile-picker{width:min(270px,calc(100vw - 104px));max-width:calc(100vw - 104px);max-height:calc(100dvh - 24px);overflow:auto;overscroll-behavior:contain}.profile-picker h4{margin:10px 8px 6px;color:#c4b5fd;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.profile-options{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 6px 8px}.profile-options button{height:42px;border:1px solid #ffffff1a;border-radius:10px;background:#ffffff0b;font-size:23px}.profile-options button:hover{background:#ffffff25;border-color:var(--ac)}.profile-options button.selected{border-color:var(--ac);background:#8b5cf633;box-shadow:0 0 0 1px var(--ac)}
#menu{position:fixed;left:80px;top:12px;width:min(270px,calc(100vw - 104px));min-width:0;max-height:calc(100dvh - 24px);overflow:auto;overscroll-behavior:contain;background:#16161f;border:1px solid #fff2;border-radius:14px;padding:8px;z-index:100;display:none}
#menu.on{display:block}#menu b{display:block;padding:8px 12px;font-size:14px}#menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;font-size:14px}#menu button:hover{background:#ffffff1a}
#tabs{position:fixed;top:22px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:#1d1d24cc;backdrop-filter:blur(10px);border:1px solid #ffffff1a;border-radius:999px;z-index:30;white-space:nowrap}
#tabs button{border:0;background:none;padding:10px 24px;border-radius:999px;color:#b8b8c6;font-weight:500}
#tabs button.on{background:#fff;color:#000;font-weight:700}
main{margin-left:72px;min-height:100vh;padding-bottom:60px}
.hero{position:relative;height:min(100vh,700px);display:flex;align-items:center;overflow:hidden}
.himg{position:absolute;right:0;top:0;width:70%;height:100%;background:var(--hero) 55% center/cover;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
.hero:after{content:"";position:absolute;inset:auto 0 0;height:40%;background:linear-gradient(transparent,var(--bg))}
.hc{position:relative;z-index:2;padding:70px 0 0 44px;max-width:560px}
.brand{font-weight:800;letter-spacing:.35em;font-size:14px;background:linear-gradient(90deg,var(--ac),#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{position:relative;margin:6px 0 4px;line-height:.95}
.cosmic{display:block;font:900 clamp(38px,6vw,72px)/1 "Cinzel Decorative",Georgia,serif;letter-spacing:.06em;background:linear-gradient(90deg,#5eead4,#60a5fa,#a78bfa,#f0abfc,#60a5fa,#5eead4);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 8s linear infinite;filter:drop-shadow(0 0 14px #7c6cff99)}
.love{display:block;margin:-6px 0 0 90px;font:400 clamp(48px,8vw,96px)/1 "Great Vibes",cursive;background:linear-gradient(180deg,#fff1f6,#fb7185 60%,#e11d74);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px #fb718599)}
.sp{position:absolute;color:#fff;animation:tw 2.4s ease-in-out infinite;pointer-events:none}
@keyframes flow{to{background-position:250% 0}}@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.ep{font-size:21px;font-weight:600;margin:14px 0 8px}
.meta{display:flex;gap:10px;align-items:center;color:var(--mut);font-size:14px;margin-bottom:12px}
.chip{background:#ffffff26;color:#fff;padding:2px 8px;border-radius:4px;font-weight:600;font-size:12px}
.desc{font-size:16px;line-height:1.55;color:#e4e4ee;max-width:480px;margin:0 0 20px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:12px 22px;background:#ffffff26;font-weight:600;font-size:15px;backdrop-filter:blur(6px)}
.btn.pri{background:#fff;color:#000}.btn:hover{filter:brightness(1.2)}
.wm{position:absolute;right:48px;bottom:90px;z-index:2;font-weight:800;letter-spacing:.3em;font-size:22px;background:linear-gradient(90deg,var(--ac),#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.row{padding:0 0 8px 44px;position:relative}.row h2{font-size:18px;font-weight:600;margin:22px 0 12px}
.wrap{position:relative}.strip{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding:6px 44px 14px 0}.strip::-webkit-scrollbar{display:none}
.ar{position:absolute;top:0;bottom:14px;width:44px;border:0;background:#000a;font-size:28px;z-index:3;opacity:0;transition:.2s}.wrap:hover .ar{opacity:1}.ar.l{left:-44px}.ar.r{right:0}
.card{flex:none;height:215px;border-radius:12px;overflow:hidden;position:relative;cursor:pointer;background:var(--card);transition:transform .2s;border:1px solid #ffffff14}
.card.p{width:148px}.card.w{width:300px}.card:hover{transform:scale(1.05);z-index:2}
.art{position:absolute;inset:0;width:100%;height:100%}
.cap{position:absolute;inset:auto 0 0;padding:26px 10px 9px;background:linear-gradient(transparent,#000d);display:flex;flex-direction:column}
.cap b{font-size:14px}.cap small{color:#c4c4d2;font-size:11px}
.hb{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:#0009;color:#fff;font-size:14px}.hb.on{color:#fb4f8a}
.tag{position:absolute;top:10px;left:10px;font-size:9px;font-weight:800;letter-spacing:.15em;color:#fff;opacity:.85}
.live{position:absolute;top:44px;left:8px;background:#e11d48;font-style:normal;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}
.pb{position:absolute;left:0;bottom:0;height:3px;background:var(--ac)}
.head{padding:96px 44px 0}.head h1{margin:0 0 6px;font-size:34px}.head p{margin:0 0 16px;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{background:#ffffff14;border:1px solid #ffffff1f;border-radius:999px;padding:7px 16px;font-size:14px}.chips button.on{background:#fff;color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-flow:dense;gap:16px;padding:22px 44px}.grid .card{width:auto}.grid .card.w{grid-column:span 2}
.empty{padding:40px 44px;color:var(--mut);font-size:17px}
.set{max-width:560px;padding:22px 44px}.set label{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #ffffff14}
.set input[type=text],.set select{background:#1b1b25;color:#fff;border:1px solid #ffffff2a;border-radius:8px;padding:8px 12px;font:inherit}
.sw{display:flex;gap:8px}.sw i{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent}.sw i.on{border-color:#fff}
#search{position:fixed;inset:0;background:#000;z-index:60;display:none;overflow:auto;padding:28px 44px 40px 90px}#search.on{display:block}
.sbar{display:flex;align-items:center;gap:12px;background:#15151c;border:1px solid #ffffff2a;border-radius:14px;padding:6px 16px;max-width:760px;margin:0 auto 26px}
.sbar input{flex:1;background:none;border:0;color:#fff;font:inherit;font-size:20px;padding:12px 0;outline:0}.sbar button{border:0;background:none;font-size:22px}
#sr{max-width:1100px;margin:0 auto}#sr .grid{padding:16px 0}
.ov{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:#000c;padding:20px}.ov.on{display:flex}
.dm{background:#12121a;border:1px solid #ffffff1f;border-radius:18px;max-width:780px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:230px 1fr;gap:22px;padding:22px}
.dm .pos{position:relative;height:330px;border-radius:12px;overflow:hidden}.dm h3{margin:0 0 8px;font-size:28px}
.more{grid-column:1/-1}.more .strip{padding-right:0}
#pl{position:fixed;inset:0;background:#000;z-index:90;display:none;overflow:hidden}#pl.on{display:block}
#pl .bg{position:absolute;inset:0;opacity:.35;filter:blur(18px)}#cv{position:absolute;inset:0;width:100%;height:100%}
#pc{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:26px 34px;background:linear-gradient(#000a,transparent 25%,transparent 65%,#000d);transition:opacity .3s}#pc.hide{opacity:0;cursor:none}
#sub{position:absolute;left:0;right:0;bottom:130px;text-align:center;font-size:24px;text-shadow:0 2px 6px #000;pointer-events:none}
.bar{height:6px;background:#ffffff33;border-radius:4px;cursor:pointer;position:relative;margin-bottom:14px}.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ac);border-radius:4px}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ctl button{background:#ffffff1f;border:0;border-radius:10px;padding:9px 14px}.ctl .sp2{flex:1}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 20px;border-radius:999px;font-weight:600;z-index:120;opacity:0;pointer-events:none;transition:.3s}#toast.on{opacity:1}
@media(max-width:760px){#side{top:auto;bottom:0;right:0;width:100%;height:58px;flex-direction:row;justify-content:space-around;padding:0;gap:0;background:#000e}#av{margin:0}
main{margin-left:0;padding-bottom:80px}#tabs{top:12px;max-width:96vw}#tabs button{padding:8px 12px;font-size:13px}.hc{padding:90px 20px 0}.himg{width:100%;opacity:.55}.row,.head{padding-left:16px}.grid,.set{padding-left:16px;padding-right:16px}#search{padding:20px 16px}.dm{grid-template-columns:1fr}.dm .pos{height:220px}#menu{left:8px;right:8px;top:auto;bottom:66px;width:auto;max-width:none;max-height:calc(100dvh - 82px);overflow:auto}.profile-picker{width:auto;max-width:none;max-height:calc(100dvh - 82px)}.wm{display:none}.card.w{width:240px}}
</style></head><body>
<nav id="side"></nav><div id="menu"></div>
<div id="tabs"><button data-t="foryou">For You</button><button data-t="dm">Drama &amp; Movie</button><button data-t="sport">SPORT</button></div>
<main id="app"></main>
<div id="search"><div class="sbar"><span>🔍</span><input id="q" type="text" placeholder="Search" autocomplete="off"><button onclick="closeSearch()" aria-label="Close">✕</button></div><div id="sr"></div></div>
<div class="ov" id="dm"></div>
<div id="pl"><div class="bg" id="pbg"></div><canvas id="cv"></canvas><div id="sub"></div>
<div id="pc"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="brand">STARSHIP</div><h2 id="pt" style="margin:4px 0 0"></h2><small id="pe" style="color:#bbb"></small></div><button class="btn" onclick="stop()">✕ Close</button></div>
<div><div class="bar" id="bar"><i id="bi"></i></div><div class="ctl"><button id="pp" onclick="tog()">⏸</button><button onclick="seek(-10)">⏪ 10</button><button onclick="seek(10)">10 ⏩</button><span id="tm">0:00</span><span class="sp2"></span><button id="cc" onclick="cc()">CC</button><button id="spd" onclick="spd()">1x</button><button onclick="mute()" id="mu">🔊</button><button onclick="fs()">⛶</button></div></div></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
function ld(){try{return JSON.parse(localStorage.getItem('starship')||'{}')}catch(e){return{}}}
const st=Object.assign({name:'Me',ac:'#8b5cf6',profileIcon:'',auto:true,subs:true,q:'Auto',fav:[],prog:{}},ld());
const sv=()=>{try{localStorage.setItem('starship',JSON.stringify(st))}catch(e){}};
const IC={search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',series:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',shows:'<rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h13v13M10 13h4M12 11v4"/>',movies:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 8h4M4 12h4M4 16h4M16 8h4M16 12h4M16 16h4"/>',dramas:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 3l4 4 4-4"/>',fav:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>'};
const NAV=[['search','Search'],['home','Home'],['series','Series'],['shows','TV Shows'],['movies','Movies'],['dramas','Series, Novelas & Dramas'],['fav','My List'],['settings','Settings']];
const D={drama:['Moonlit Promise','Seoul Letters','Hearts in Orbit','The Last Lantern','Velvet Rain','Crown of Ashes','Midnight Confession','Sunflower Street','Echoes of Spring','Silk & Thunder'],series:['Nebula Squad','Quantum Café','Dark Harbor','Starfall Academy','The Glass Detective','Neon Samurai','Wild Orbit','Ghost Signal'],show:['Chef Galaxy','Talk of the Stars','Lip Sync Planet','Dance Off Nova','Tiny Home Moon','Laugh Station','Cooking Quest','Pet Parade'],movie:['Aurora Run','The Paper Moon','Last Train to Mars','Heartbeat Protocol','Salt & Starlight','Iron Garden','Little Comet','Beyond the Blue Door','Midnight Carousel','Orbit of Us'],sport:['Champions Night','Derby Live','Grand Slam Finals','Fight Night Ultimate','Basketball Showdown','Formula Stars','Baseball Classic','Surf Masters']};
const G={drama:['Romance','Fantasy','Melodrama','Mystery'],series:['Sci-Fi','Thriller','Comedy','Action'],show:['Reality','Talk','Cooking','Music'],movie:['Romance','Sci-Fi','Animation','Adventure','Fantasy'],sport:['Football','Basketball','Tennis','MMA','Racing']};
let sd=11;const rnd=()=>(sd=sd*16807%2147483647)/2147483647,pk=a=>a[rnd()*a.length|0];
const cat=[{id:'cosmic',title:'Cosmic Love',type:'drama',genre:'Romance',year:2026,rate:'TV-14',hue:280,img:1,wide:1,desc:'Two strangers share one bench, one night and a sky that keeps rearranging itself. A galactic romance about fate, second chances and the stars that bring us back.'}];
let n=0;for(const t in D)D[t].forEach(x=>{const g=pk(G[t]);cat.push({id:'t'+n++,title:x,type:t,genre:g,year:2018+(rnd()*9|0),rate:pk(['TV-PG','TV-14','TV-MA','PG-13']),hue:rnd()*360|0,motif:rnd()*8|0,wide:rnd()<.35,live:t==='sport'&&rnd()<.45,desc:`A ${g.toLowerCase()} ${t==='sport'?'broadcast':t==='movie'?'feature':t==='show'?'show':'story'} where every episode pulls you further in. Watch it first on Starship.`})});
const TN={drama:'Drama',series:'Series',show:'TV Show',movie:'Movie',sport:'Sports'};
function art(it){if(it.img)return'<div class="art" style="background:var(--hero) 60% center/cover"></div>';const h=it.hue,h2=(h+50)%360,c=`hsl(${h2} 90% 72%)`;let s='';for(let i=0;i<14;i++)s+=`<circle cx="${rnd()*100|0}" cy="${rnd()*70|0}" r="${.6+rnd()*1.4}" fill="#fff"/>`;
const m=[`<circle cx="50" cy="42" r="20" fill="${c}"/><ellipse cx="50" cy="42" rx="34" ry="7" fill="none" stroke="#fffa" stroke-width="2" transform="rotate(-18 50 42)"/>`,`<path d="M50 64C18 40 32 18 50 34C68 18 82 40 50 64Z" fill="${c}"/><path d="M80 24c-8-6-12 2-5 7 7-5 13-1 5-7z" fill="#fff8"/>`,`<circle cx="68" cy="28" r="10" fill="${c}"/><path d="M0 82L30 44l20 24 20-28 30 42z" fill="#0007"/>`,s,`<path d="M0 55q12-10 25 0t25 0 25 0 25 0v45H0z" fill="#fff3"/><path d="M0 70q12-10 25 0t25 0 25 0 25 0v30H0z" fill="#0005"/>`,`<circle cx="50" cy="42" r="20" fill="#fff"/><path d="M30 42h40M50 22v40M36 28q14 14 0 28M64 28q-14 14 0 28" stroke="#222" stroke-width="2" fill="none"/>`,`<circle cx="50" cy="40" r="20" fill="${c}"/><circle cx="58" cy="34" r="18" fill="hsl(${h} 70% 20%)"/>`,`<path d="M0 80V50h14V35h16v30h10V25h18v40h12V45h14v35z" fill="#0008"/><circle cx="25" cy="20" r="2" fill="#fff"/>`][it.motif];
return`<svg class="art" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g${it.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h} 70% 30%)"/><stop offset="1" stop-color="hsl(${h2} 75% 11%)"/></linearGradient></defs><rect width="100" height="100" fill="url(#g${it.id})"/>${m}</svg>`}
const isF=id=>st.fav.includes(id);
function card(it){const p=st.prog[it.id];return`<div class="card ${it.wide?'w':'p'}" data-id="${it.id}" tabindex="0">${art(it)}<span class="tag">STARSHIP</span>${it.live?'<i class="live">● LIVE</i>':''}<button class="hb ${isF(it.id)?'on':''}" data-f="${it.id}" aria-label="My List">♥</button><div class="cap"><b>${it.title}</b><small>${it.genre} · ${it.year}</small></div>${p?`<i class="pb" style="width:${Math.min(95,p/25)}%"></i>`:''}</div>`}
const rows=l=>l.map(([t,a])=>a.length?`<section class="row"><h2>${t}</h2><div class="wrap"><button class="ar l">‹</button><div class="strip">${a.map(card).join('')}</div><button class="ar r">›</button></div></section>`:'').join('');
const T=(...t)=>cat.filter(i=>t.includes(i.type));let cur='foryou',gf='All';
const mix=(a,k)=>a.slice(k).concat(a.slice(0,k));
function hero(){const c=cat[0];return`<section class="hero"><div class="himg"></div><div class="hc"><div class="brand">STARSHIP</div><div class="logo"><span class="sp" style="left:-14px;top:4px">✦</span><span class="sp" style="left:250px;top:-6px;animation-delay:.8s">✧</span><span class="cosmic">Cosmic</span><span class="love">Love</span><span class="sp" style="left:330px;top:100px;color:#fda4af;animation-delay:1.4s">✦</span></div><div class="ep">New Episode Every Tuesday</div><div class="meta"><span class="chip">TV-14</span><span>2026 · 1 Season · Drama, Romance, Fantasy</span></div><p class="desc">${c.desc}</p><div class="btns"><button class="btn pri" onclick="play('cosmic')">▶ PLAY</button><button class="btn" id="hf" onclick="fav('cosmic')">${isF('cosmic')?'✓ In My List':'+ My List'}</button><button class="btn" onclick="info('cosmic')">ⓘ Info</button></div></div><div class="wm">STARSHIP</div></section>`}
const VT={series:['Series','Fast-paced stories, one episode at a time.',['series']],shows:['TV Shows','Reality, talk, cooking and more.',['show']],movies:['Movies','Feature films for any mood.',['movie']],dramas:['Series, Novelas & Dramas','Long stories worth getting lost in.',['series','drama']],fav:['My List','Everything you saved.',null]};
function render(){const a=$('#app');let h='';
const cont=cat.filter(i=>st.prog[i.id]);
if(cur==='foryou')h=hero()+rows([['Continue watching',cont],['Featured',mix(cat,3).slice(0,14)],['Trending now',mix(cat,17).slice(0,14)],['New dramas',T('drama')],['Movies for tonight',T('movie')],['Series to binge',T('series')],['Live sports',T('sport')],['TV Shows',T('show')]]);
else if(cur==='dm')h=`<div class="head"><h1>Drama &amp; Movie</h1><p>Heartbreak, wonder and everything in between.</p></div>`+rows([['Romance',T('drama','movie').filter(i=>i.genre==='Romance')],['Fantasy',T('drama','movie').filter(i=>i.genre==='Fantasy')],['All dramas',T('drama')],['All movies',T('movie')]]);
else if(cur==='sport')h=`<div class="head"><h1>SPORT</h1><p>Live matches, replays and highlights.</p></div>`+rows([['Live now',T('sport').filter(i=>i.live)],['Replays & highlights',T('sport').filter(i=>!i.live)],['By sport',T('sport')]]);
else if(cur==='settings')h=`<div class="head"><h1>Settings</h1></div><div class="set"><label>Profile name<input type="text" value="${st.name}" maxlength="14" onchange="st.name=this.value||'Me';sv();nav();toast('Saved')"></label><label>Accent color<span class="sw">${['#8b5cf6','#f43f5e','#06b6d4','#22c55e','#f59e0b'].map(c=>`<i style="background:${c}" class="${st.ac===c?'on':''}" onclick="st.ac='${c}';sv();ac();render()"></i>`).join('')}</span></label><label>Autoplay next episode<input type="checkbox" ${st.auto?'checked':''} onchange="st.auto=this.checked;sv()"></label><label>Subtitles on by default<input type="checkbox" ${st.subs?'checked':''} onchange="st.subs=this.checked;sv()"></label><label>Quality<select onchange="st.q=this.value;sv();toast('Quality: '+this.value)">${['Auto','1080p','720p','480p'].map(q=>`<option ${st.q===q?'selected':''}>${q}</option>`).join('')}</select></label><label>Watch history<button class="btn" onclick="st.prog={};sv();toast('History cleared')">Clear</button></label><label>My List<button class="btn" onclick="st.fav=[];sv();toast('My List cleared')">Clear</button></label></div>`;
else{const v=VT[cur];let l=v[2]?T(...v[2]):cat.filter(i=>isF(i.id));const gs=['All',...new Set(l.map(i=>i.genre))];if(!gs.includes(gf))gf='All';if(gf!=='All')l=l.filter(i=>i.genre===gf);
h=`<div class="head"><h1>${v[0]}</h1><p>${v[1]}</p>${v[2]?`<div class="chips">${gs.map(g=>`<button class="${g===gf?'on':''}" onclick="gf='${g}';render()">${g}</button>`).join('')}</div>`:''}</div>`+(l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<div class="empty">Nothing here yet. Tap ♥ on any title to add it to My List.</div>`)}
a.innerHTML=h;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===cur));nav();scrollTo(0,0)}
function nav(){const on=['foryou','dm','sport'].includes(cur)?'home':cur;$('#side').innerHTML=`<div class="profile-actions"><button class="ib" id="av" title="${st.name}" aria-label="Cambiar foto de perfil" onclick="menu()">${st.profileIcon?`<span class="profile-glyph">${st.profileIcon}</span>`:st.name[0].toUpperCase()}</button><button class="ib" id="home-shortcut" title="Volver al inicio" aria-label="Volver al inicio" onclick="window.location.assign('../../index.html')">☾✦</button></div>`+NAV.map(([k,t])=>`<button class="ib ${k===on?'on':''}" title="${t}" aria-label="${t}" onclick="go('${k}')"><svg viewBox="0 0 24 24" ${k==='home'&&on==='home'?'style="fill:currentColor"':''}>${IC[k]}</svg></button>`).join('')}
function go(k){$('#menu').classList.remove('on');if(k==='search')return openSearch();cur=k==='home'?'foryou':k;gf='All';render()}
function menu(){const m=$('#menu'),wasPicker=m.classList.contains('profile-picker');m.classList.remove('profile-picker');m.innerHTML=`<b>Hi, ${st.name} ✦</b><button onclick="profilePicker()">▣ Change profile picture</button><button onclick="go('fav')">★ My List</button><button onclick="go('settings')">⚙ Settings</button><button onclick="toast('Signed out (demo)');go('home')">⎋ Sign out</button>`;m.style.removeProperty('display');m.style.removeProperty('visibility');m.style.removeProperty('opacity');if(wasPicker)m.classList.add('on');else m.classList.toggle('on')}
function profilePicker(){const m=$('#menu');const groups=[['Galaxia',['🌙','🌌','🪐','⭐','☄️']],['Fantasía',['🦄','🧚','🧙','🐉','🔮']],['Drama',['🎭','🌹','🦢','💔','🎬']],['Acción',['⚔️','🔥','🦅','🥷','🚀']]];m.style.removeProperty('display');m.style.removeProperty('visibility');m.style.removeProperty('opacity');m.classList.add('on','profile-picker');m.innerHTML=`<b>Choose your profile picture ✦</b><button onclick="menu()">← Back</button>`+groups.map(([name,icons])=>`<h4>${name}</h4><div class="profile-options">${icons.map(icon=>`<button class="${st.profileIcon===icon?'selected':''}" aria-label="Elegir ${icon}" title="${icon}" onclick="chooseProfileIcon('${icon}')">${icon}</button>`).join('')}</div>`).join('')+`<button onclick="chooseProfileIcon('')">↺ Restore default</button>`}
function chooseProfileIcon(icon){st.profileIcon=icon;sv();nav();profilePicker();toast(icon?'Profile picture updated ✦':'Default profile restored')}
function ac(){document.documentElement.style.setProperty('--ac',st.ac)}
function fav(id){const i=st.fav.indexOf(id);i<0?st.fav.push(id):st.fav.splice(i,1);sv();toast(i<0?'Added to My List':'Removed from My List');const b=$('#hf');if(b)b.textContent=isF('cosmic')?'✓ In My List':'+ My List';document.querySelectorAll(`[data-f="${id}"]`).forEach(e=>e.classList.toggle('on',isF(id)));if(cur==='fav')render()}
function info(id){const it=cat.find(i=>i.id===id),p=st.prog[id],rel=cat.filter(i=>i.id!==id&&(i.genre===it.genre||i.type===it.type)).slice(0,8);
$('#dm').innerHTML=`<div class="dm"><div class="pos">${art(it)}</div><div><h3>${it.title}</h3><div class="meta"><span class="chip">${it.rate}</span><span>${it.year} · ${TN[it.type]} · ${it.genre}</span></div><p class="desc">${it.desc}</p><div class="btns"><button class="btn pri" onclick="play('${id}')">▶ ${p?'RESUME':'PLAY'}</button><button class="btn" onclick="fav('${id}')">♥ My List</button><button class="btn" onclick="toast('Link copied')">Share</button><button class="btn" onclick="$('#dm').classList.remove('on')">Close</button></div></div><div class="more"><h2 style="font-size:16px">More like this</h2><div class="strip">${rel.map(card).join('')}</div></div></div>`;$('#dm').classList.add('on')}
function openSearch(){$('#search').classList.add('on');$('#q').value='';$('#q').focus();find('')}
function closeSearch(){$('#search').classList.remove('on')}
function find(v){v=v.trim().toLowerCase();const r=v?cat.filter(i=>(i.title+i.genre+TN[i.type]+i.year).toLowerCase().includes(v)):[];
$('#sr').innerHTML=v?(r.length?`<div class="grid">${r.map(card).join('')}</div>`:`<div class="empty">No results for “${v}”. Try a genre like Romance or Sci-Fi.</div>`):`<h2 style="font-size:16px;color:var(--mut)">Try searching for</h2><div class="chips">${['Romance','Fantasy','Sci-Fi','Football','Movie','Drama','Cooking','Racing'].map(g=>`<button onclick="$('#q').value='${g}';find('${g}')">${g}</button>`).join('')}</div>`}
$('#q').oninput=e=>find(e.target.value);
document.addEventListener('click',e=>{const f=e.target.closest('[data-f]');if(f){e.stopPropagation();return fav(f.dataset.f)}
const ar=e.target.closest('.ar');if(ar){const s=ar.parentNode.querySelector('.strip');return s.scrollBy({left:(ar.classList.contains('l')?-1:1)*s.clientWidth*.8})}
const c=e.target.closest('.card');if(c){closeSearch();return info(c.dataset.id)}
if(e.target.id==='dm')$('#dm').classList.remove('on')});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#menu')&&!e.target.closest('#av'))closeProfileDropdown()},true);
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{cur=b.dataset.t;render()});
function closeProfileDropdown(){const m=$('#menu');m.classList.remove('on','profile-picker');m.style.removeProperty('display');m.style.removeProperty('visibility');m.style.removeProperty('opacity')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeProfileDropdown()});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('on'),1800)}
/* PLAYER */
let P=null,iv,raf,idle,ccOn=true,SP=[1,1.25,1.5,2],si=0;const LN=['“The stars remember what we forget.”','“Stay. Just until the sky changes.”','“Some nights are bigger than the universe.”','“I never learned how to say goodbye.”','♪ soft music ♪'];
const fm=s=>{s=s|0;const h=s/3600|0,m=(s%3600/60|0),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
function play(id){const it=cat.find(i=>i.id===id);$('#dm').classList.remove('on');const d=it.type==='movie'?6300:it.type==='sport'?7200:2520;P={it,t:st.prog[id]||0,d,on:1,ep:1+(it.id.length*3%8)};ccOn=st.subs;si=0;
$('#pt').textContent=it.title;$('#pe').textContent=it.type==='movie'||it.type==='sport'?TN[it.type]+' · '+st.q:`Season 1 · Episode ${P.ep} · ${st.q}`;$('#pbg').innerHTML=art(it);$('#pl').classList.add('on');$('#pp').textContent='⏸';$('#spd').textContent='1x';wake();
clearInterval(iv);iv=setInterval(tick,250);cancelAnimationFrame(raf);stars();if(it.id==='cosmic')toast('Now playing: Cosmic Love ✦')}
function tick(){if(!P||!P.on)return;P.t+=.25*SP[si];if(P.t>=P.d){if(st.auto&&P.it.type!=='movie'){P.ep++;P.t=0;$('#pe').textContent=`Season 1 · Episode ${P.ep} · ${st.q}`;toast('Next episode ▶')}else return stop(1)}
$('#bi').style.width=P.t/P.d*100+'%';$('#tm').textContent=fm(P.t)+' / '+fm(P.d);$('#sub').textContent=ccOn?LN[(P.t/6|0)%LN.length]:'';if((P.t*4|0)%20===0){st.prog[P.it.id]=P.t;sv()}}
function stop(done){if(P){st.prog[P.it.id]=done?0:P.t;if(done)delete st.prog[P.it.id];sv()}P=null;clearInterval(iv);cancelAnimationFrame(raf);$('#pl').classList.remove('on');if(document.fullscreenElement)document.exitFullscreen();render()}
const tog=()=>{if(!P)return;P.on=!P.on;$('#pp').textContent=P.on?'⏸':'▶'},seek=s=>{if(P)P.t=Math.max(0,Math.min(P.d-1,P.t+s))},cc=()=>{ccOn=!ccOn;toast('Subtitles '+(ccOn?'on':'off'))},spd=()=>{si=(si+1)%4;$('#spd').textContent=SP[si]+'x'},fs=()=>document.fullscreenElement?document.exitFullscreen():$('#pl').requestFullscreen&&$('#pl').requestFullscreen();
let mt=0;const mute=()=>{mt=!mt;$('#mu').textContent=mt?'🔇':'🔊'};
$('#bar').onclick=e=>{if(P){const r=e.currentTarget.getBoundingClientRect();P.t=(e.clientX-r.left)/r.width*P.d}};
function wake(){$('#pc').classList.remove('hide');clearTimeout(idle);idle=setTimeout(()=>P&&P.on&&$('#pc').classList.add('hide'),3000)}$('#pl').onmousemove=wake;
function stars(){const c=$('#cv'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const S=Array.from({length:140},()=>({x:Math.random()-.5,y:Math.random()-.5,z:Math.random()}));
(function f(){raf=requestAnimationFrame(f);x.clearRect(0,0,c.width,c.height);x.fillStyle='#fff';const v=P&&P.on?.006*SP[si]:0;for(const s of S){s.z-=v;if(s.z<=0)s.z=1;const k=.35/s.z,px=c.width/2+s.x*c.width*k,py=c.height/2+s.y*c.height*k;x.globalAlpha=1-s.z;x.fillRect(px,py,1+(1-s.z)*2,1+(1-s.z)*2)}})()}
document.addEventListener('keydown',e=>{if(e.target.id==='q'&&e.key!=='Escape')return;
if(P){if(e.key===' '){e.preventDefault();tog()}else if(e.key==='ArrowRight')seek(10);else if(e.key==='ArrowLeft')seek(-10);else if(e.key==='f')fs();else if(e.key==='m')mute();else if(e.key==='c')cc();else if(e.key==='Escape')stop();wake();return}
if(e.key==='Escape'){closeSearch();$('#dm').classList.remove('on');$('#menu').classList.remove('on')}else if(e.key==='/'){e.preventDefault();openSearch()}else if(e.key==='Enter'&&e.target.classList.contains('card'))info(e.target.dataset.id)});
ac();render();
</script></body></html>
