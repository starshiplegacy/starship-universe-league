        function init3DViewer() {
            const canvasEl = document.getElementById('map-3d-canvas');
            const container = document.getElementById('viewer-3d-container');
            if (!canvasEl || !container || typeof THREE === 'undefined') return;

            if (!renderer3D) {
                scene3D = new THREE.Scene();
                scene3D.fog = new THREE.FogExp2(0x040d1d, 0.012);

                camera3D = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.1, 2000);
                camera3D.position.set(14, 11, 16);

                renderer3D = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true, alpha: true });
                renderer3D.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer3D.outputEncoding = THREE.sRGBEncoding;
                renderer3D.toneMapping = THREE.ACESFilmicToneMapping;
                renderer3D.toneMappingExposure = 1.15;

                // Iluminación táctica Sci-Fi
                const hemiLight = new THREE.HemisphereLight(0x7dd3fc, 0x0f172a, 1.15);
                scene3D.add(hemiLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
                dirLight.position.set(18, 28, 16);
                scene3D.add(dirLight);

                const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.75);
                rimLight.position.set(-18, 12, -16);
                scene3D.add(rimLight);

                // Rejilla holográfica base
                const gridHelper = new THREE.GridHelper(40, 40, 0x00e5ff, 0x0c4a6e);
                gridHelper.material.opacity = 0.28;
                gridHelper.material.transparent = true;
                scene3D.add(gridHelper);

                currentMapGroup = new THREE.Group();
                scene3D.add(currentMapGroup);

                if (THREE.OrbitControls) {
                    controls3D = new THREE.OrbitControls(camera3D, canvasEl);
                    controls3D.enableDamping = true;
                    controls3D.dampingFactor = 0.06;
                    controls3D.autoRotate = true;
                    controls3D.autoRotateSpeed = 1.1;
                }

                // Drag & Drop en el visor 3D
                const dropOverlay = document.getElementById('viewer-drop-overlay');
                container.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    dropOverlay.classList.add('drag-active');
                });
                container.addEventListener('dragleave', () => {
                    dropOverlay.classList.remove('drag-active');
                });
                container.addEventListener('drop', (e) => {
                    e.preventDefault();
                    dropOverlay.classList.remove('drag-active');
                    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                        processUploadedMapFile(e.dataTransfer.files[0]);
                    }
                });
            }

            resize3DViewer();
            if (!anim3DId) {
                animate3DViewer();
            }
        }

        function resize3DViewer() {
            const container = document.getElementById('viewer-3d-container');
            if (!renderer3D || !camera3D || !container || container.classList.contains('hidden')) return;
            const w = container.clientWidth || 680;
            const h = container.clientHeight || 265;
            camera3D.aspect = w / h;
            camera3D.updateProjectionMatrix();
            renderer3D.setSize(w, h, false);
        }

        function animate3DViewer() {
            anim3DId = requestAnimationFrame(animate3DViewer);
            if (controls3D) controls3D.update();
            if (renderer3D && scene3D && camera3D) {
                renderer3D.render(scene3D, camera3D);
            }
        }

        function clearCurrent3DMap() {
            if (!currentMapGroup) return;
            while (currentMapGroup.children.length > 0) {
                currentMapGroup.remove(currentMapGroup.children[0]);
            }
        }

        function fitCameraToObject(object3D) {
            const box = new THREE.Box3().setFromObject(object3D);
            if (box.isEmpty()) return;
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z) || 10;

            object3D.position.sub(center);
            object3D.position.y += size.y * 0.5;

            const dist = maxDim * 1.45;
            camera3D.position.set(dist * 0.85, dist * 0.65, dist * 0.95);
            if (controls3D) {
                controls3D.target.set(0, size.y * 0.35, 0);
                controls3D.update();
            }
        }

        function reset3DCamera() {
            playHoverSound();
            if (currentMapGroup && currentMapGroup.children.length > 0) {
                fitCameraToObject(currentMapGroup);
            }
        }

        // Genera una maqueta 3D táctica fiel mientras se carga el .glb/.zip externo
        function buildTacticalFallbackMap(type) {
            clearCurrent3DMap();
            const matGround = new THREE.MeshStandardMaterial({ color: 0x3f6212, roughness: 0.85 });
            const matStone = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.6 });
            const matAccent = new THREE.MeshStandardMaterial({ color: 0x0ea5e9, emissive: 0x0284c7, emissiveIntensity: 0.5 });
            const matGold = new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xd97706, emissiveIntensity: 0.45 });

            const base = new THREE.Mesh(new THREE.BoxGeometry(16, 0.5, 16), matGround);
            currentMapGroup.add(base);

            if (type === 'training_sim') {
                // Complejo de Entrenamiento (For Training)
                const hq = new THREE.Mesh(new THREE.BoxGeometry(5, 2.6, 4.5), matStone);
                hq.position.set(-4, 1.5, -3.5);
                currentMapGroup.add(hq);

                const tower = new THREE.Mesh(new THREE.BoxGeometry(2.2, 3.8, 2.2), matStone);
                tower.position.set(-4, 2.1, -3.5);
                currentMapGroup.add(tower);

                // Dianas holográficas de tiro
                [[-1, 2], [2.5, 0.5], [1, 4.5], [4.5, 3]].forEach(([x, z], i) => {
                    const target = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 1.4, 16), i % 2 === 0 ? matAccent : matGold);
                    target.position.set(x, 0.95, z);
                    currentMapGroup.add(target);
                });
            } else if (type === 'versus_lobby_1_3') {
                // BeginningLobby (Versus 1 a 3)
                const platform = new THREE.Mesh(new THREE.CylinderGeometry(6.5, 7.2, 0.7, 8), matStone);
                platform.position.y = 0.45;
                currentMapGroup.add(platform);

                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2;
                    const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.9, 3.6, 0.9), matAccent);
                    pillar.position.set(Math.cos(angle) * 5.2, 2.1, Math.sin(angle) * 5.2);
                    currentMapGroup.add(pillar);
                }
            } else {
                // Battle Guys Arena (Versus 4 a 5)
                const blocks = [
                    [-4.5, 1.2, -4.5, 3, 2, 3],
                    [4.5, 1.2, 4.5, 3, 2, 3],
                    [-4.5, 1.0, 4.5, 2.5, 1.6, 2.5],
                    [4.5, 1.0, -4.5, 2.5, 1.6, 2.5],
                    [0, 1.5, 0, 3.2, 2.6, 3.2]
                ];
                blocks.forEach(([x, y, z, w, h, d], idx) => {
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), idx === 4 ? matGold : matStone);
                    mesh.position.set(x, y, z);
                    currentMapGroup.add(mesh);
                });
            }
            fitCameraToObject(currentMapGroup);
        }

        // Intenta cargar automáticamente el .glb local; si no está servido por HTTP, muestra la maqueta y permite subir el .zip/.glb
        function loadMapAssetVariant(assetCfg) {
            init3DViewer();
            buildTacticalFallbackMap(assetCfg.fallbackType);
            setViewerUIState(`Cargando ${assetCfg.label}...`, 'bg-amber-400 animate-pulse', false);

            if (assetCfg.isTexturePreview) {
                const texLoader = new THREE.TextureLoader();
                texLoader.load(
                    assetCfg.relativePath,
                    (texture) => {
                        clearCurrent3DMap();
                        texture.encoding = THREE.sRGBEncoding;
                        const plane = new THREE.Mesh(
                            new THREE.PlaneGeometry(16, 10),
                            new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide })
                        );
                        plane.position.y = 5.2;
                        currentMapGroup.add(plane);
                        fitCameraToObject(currentMapGroup);
                        setViewerUIState('BeginningLobby (Actual.png) • Vista 3D', 'bg-emerald-400', false);
                    },
                    undefined,
                    () => {
                        setViewerUIState(
                            `${assetCfg.label} (Vista Táctica)`,
                            'bg-amber-400',
                            true,
                            'Sube o arrastra tu archivo <strong>Versus.zip</strong> para cargar las vistas de <strong>BeginningLobby</strong> o el modelo <strong>.glb</strong>.'
                        );
                    }
                );
                return;
            }

            if (!THREE.GLTFLoader) return;
            const loader = new THREE.GLTFLoader();
            loader.load(
                assetCfg.relativePath,
                (gltf) => {
                    clearCurrent3DMap();
                    currentMapGroup.add(gltf.scene);
                    fitCameraToObject(currentMapGroup);
                    setViewerUIState(`${assetCfg.label} • Modelo 3D Activo`, 'bg-emerald-400', false);
                },
                undefined,
                () => {
                    setViewerUIState(
                        `${assetCfg.label} • Esperando archivo`,
                        'bg-amber-400',
                        true,
                        `Selecciona o arrastra <strong>${assetCfg.zipMatch}</strong> (o su archivo <strong>.zip</strong>) para visualizar el mapa 3D completo.`
                    );
                }
            );
        }

        function handleMapFileUpload(event) {
            const file = event.target.files && event.target.files[0];
            if (file) processUploadedMapFile(file);
            event.target.value = '';
        }

        async function processUploadedMapFile(file) {
            init3DViewer();
            const fileName = file.name.toLowerCase();
            setViewerUIState(`Procesando ${file.name}...`, 'bg-sky-400 animate-ping', false);

            try {
                if (fileName.endsWith('.glb') || fileName.endsWith('.gltf')) {
                    const buffer = await file.arrayBuffer();
                    parseGLBArrayBuffer(buffer, file.name);
                } else if (fileName.endsWith('.zip') && typeof JSZip !== 'undefined') {
                    const zip = await JSZip.loadAsync(file);
                    const entries = Object.keys(zip.files).filter(k => !zip.files[k].dir);

                    // Buscar primero un archivo .glb dentro del ZIP
                    const glbEntry = entries.find(k => k.toLowerCase().endsWith('.glb'));
                    if (glbEntry) {
                        const glbBuffer = await zip.files[glbEntry].async('arraybuffer');
                        const cleanName = glbEntry.split('/').pop();
                        parseGLBArrayBuffer(glbBuffer, cleanName);
                        playSelectSound(true);
                        return;
                    }

                    // Si el ZIP contiene imágenes de referencia (ej. Actual.png / Example.png)
                    const imgEntry = entries.find(k => k.toLowerCase().endsWith('actual.png') || k.toLowerCase().endsWith('.png'));
                    if (imgEntry) {
                        const blob = await zip.files[imgEntry].async('blob');
                        const url = URL.createObjectURL(blob);
                        const texLoader = new THREE.TextureLoader();
                        texLoader.load(url, (texture) => {
                            clearCurrent3DMap();
                            texture.encoding = THREE.sRGBEncoding;
                            const plane = new THREE.Mesh(
                                new THREE.PlaneGeometry(16, 10),
                                new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide })
                            );
                            plane.position.y = 5.2;
                            currentMapGroup.add(plane);
                            fitCameraToObject(currentMapGroup);
                            setViewerUIState(`${imgEntry.split('/').pop()} • Extraído de ZIP`, 'bg-emerald-400', false);
                        });
                    }
                }
            } catch (err) {
                setViewerUIState('Error al leer el archivo 3D', 'bg-rose-500', true, 'Verifica que el archivo sea un <strong>.glb</strong> o <strong>.zip</strong> válido.');
            }
        }

        function parseGLBArrayBuffer(arrayBuffer, displayName) {
            const loader = new THREE.GLTFLoader();
            loader.parse(
                arrayBuffer,
                '',
                (gltf) => {
                    clearCurrent3DMap();
                    currentMapGroup.add(gltf.scene);
                    fitCameraToObject(currentMapGroup);
                    setViewerUIState(`${displayName} • Render 3D Activo`, 'bg-emerald-400', false);
                },
                () => {
                    setViewerUIState('No se pudo parsear el modelo GLB', 'bg-rose-500', true);
                }
            );
        }

        function openDeployModal(modeKey) {
            const cfg = modeConfigs[modeKey];
            if (!cfg) return;

            currentModeKey = modeKey;
            playSelectSound(modeKey === 'royale');
            resetMatchmaking();

            const modal = document.getElementById('tactical-modal');
            modal.style.borderColor = cfg.accent;
            modal.style.boxShadow = `0 0 40px ${cfg.accent}55, inset 0 0 20px ${cfg.accent}22`;

            document.getElementById('modal-tag').textContent = cfg.tag;
            document.getElementById('modal-tag').style.color = cfg.accent;
            document.getElementById('modal-tag').style.borderColor = `${cfg.accent}66`;

            document.getElementById('modal-title').textContent = cfg.title;
            document.getElementById('modal-desc').textContent = cfg.desc;
            document.getElementById('modal-players').textContent = cfg.players;
            document.getElementById('modal-queue').textContent = cfg.queue;
            document.getElementById('modal-squad').textContent = cfg.squad;

            const viewerContainer = document.getElementById('viewer-3d-container');
            if (cfg.has3DViewer && mapAssetCatalog[modeKey]) {
                viewerContainer.classList.remove('hidden');
                setTimeout(() => {
                    loadMapAssetVariant(mapAssetCatalog[modeKey][0]);
                }, 40);
            } else {
                viewerContainer.classList.add('hidden');
            }

            const optionsContainer = document.getElementById('modal-options');
            optionsContainer.innerHTML = '';
            selectedOptionIndex = 0;

            cfg.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `interactive-target p-2.5 rounded text-xs font-semibold border text-center transition-all ${
                    idx === 0 
                    ? 'bg-sky-500/25 border-sky-400 text-white shadow-[0_0_12px_rgba(56,189,248,0.3)]' 
                    : 'bg-slate-900/70 border-slate-700 text-slate-400 hover:border-slate-500'
                }`;
                btn.textContent = opt;
                btn.onclick = () => {
                    playHoverSound();
                    selectedOptionIndex = idx;
                    Array.from(optionsContainer.children).forEach((child, cIdx) => {
                        if (cIdx === idx) {
                            child.className = 'interactive-target p-2.5 rounded text-xs font-semibold border text-center transition-all bg-sky-500/25 border-sky-400 text-white shadow-[0_0_12px_rgba(56,189,248,0.3)]';
                        } else {
                            child.className = 'interactive-target p-2.5 rounded text-xs font-semibold border text-center transition-all bg-slate-900/70 border-slate-700 text-slate-400 hover:border-slate-500';
                        }
                    });

                    // Cambiar variante del mapa 3D si corresponde (ej. Versus 4 a 5 vs Versus 1 a 3)
                    if (cfg.has3DViewer && mapAssetCatalog[modeKey]) {
                        const variant = mapAssetCatalog[modeKey][idx] || mapAssetCatalog[modeKey][0];
                        loadMapAssetVariant(variant);
                    }
                };
                optionsContainer.appendChild(btn);
            });

            bindInteractiveHover();
            document.getElementById('deploy-modal-backdrop').classList.add('active');
        }
<!-- ... existing code ... -->
        // Inicialización al cargar ventana
        window.onload = function () {
            resizeCanvas();
            drawBackground();
            bindInteractiveHover();
            window.addEventListener('resize', resize3DViewer);
        };
    </script>
