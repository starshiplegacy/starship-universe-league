<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>League of Legends – Home</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#010a13;--gold:#c8aa6e;--gold-d:#785a28;--txt:#a09b8c;--hi:#f0e6d2;--blue:#0397ab;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{height:100%;background:#000;overflow:hidden;font-family:Lato,"Segoe UI",Arial,sans-serif}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);overflow:hidden;color:var(--txt)}
.abs{position:absolute}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.cin{font-family:Cinzel,"Trajan Pro",Georgia,serif}
/* top bar */
#top{left:0;top:0;width:1280px;height:80px;background:linear-gradient(#0a1420,#010a13);border-top:2px solid var(--gold-d);border-bottom:1px solid #1e2328}
#notch{left:276px;top:0;width:28px;height:14px}
#logo{left:32px;top:20px;width:40px;height:40px}
#play{left:72px;top:24px;width:116px;height:36px;border:2px solid #1b3d52;background:linear-gradient(90deg,#0a1a26,#0c2a3a);color:var(--hi);font:700 14px Cinzel,serif;letter-spacing:2px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%)}
#play:hover,#play.q{background:linear-gradient(90deg,#0f2c3f,#14485f);color:#fff}
#info{left:207px;top:27px;width:30px;height:30px;border-radius:50%;border:2px solid #0a96aa;background:#0a3a52;color:#0ac8e0;font:700 18px Lato}
.nav{top:0;height:80px;padding:0 16px;font:700 13px Cinzel,serif;letter-spacing:1.5px;color:var(--txt);display:flex;align-items:center;margin-top:0}
.nav:hover{color:var(--hi)}
.nav.on{color:var(--hi);background:linear-gradient(#232a31,#14191e);border-bottom:0}
.nav.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--gold-d)}
.ic{cursor:pointer}.ic:hover{filter:brightness(1.5)}
#div{left:928px;top:16px;width:1px;height:48px;background:#2a2f35}
.cur{font:700 14px Lato;color:var(--hi);letter-spacing:.5px}
#avatar{left:1062px;top:8px;width:60px;height:60px;border-radius:50%;border:3px solid var(--gold);background:radial-gradient(circle at 50% 40%,#2b3b55,#0a111c);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #1e2328}
#lvl{left:1075px;top:58px;width:34px;height:15px;background:#1e2328;border:1px solid var(--gold-d);color:var(--txt);font:700 10px Lato;text-align:center;line-height:13px;border-radius:2px}
#online{left:1128px;top:50px;color:#0ac86e;font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer}
#online i{width:10px;height:10px;border-radius:50%;background:#0ac86e;border:2px solid #0a6a3a}
.wb{top:8px;width:20px;height:20px;color:var(--txt);font:700 16px Lato;text-align:center;line-height:20px}
.wb:hover{color:var(--hi)}
/* subnav */
.sub{top:90px;font:700 11px Lato;letter-spacing:1.5px;color:var(--txt);padding:2px 0 8px}
.sub:hover{color:var(--hi)}
.sub.on{color:var(--hi)}
.sub.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--gold)}
#rot{left:840px;top:102px;width:182px;height:34px;border:2px solid transparent;background:transparent;color:transparent}
#rot:hover{border-color:var(--gold)}.cta:hover{border-color:var(--gold);color:#fff}
/* hero */
#hero{background:radial-gradient(ellipse at 25% 60%,#0b1626,#030a14 70%);left:0;top:80px;width:1056px;height:425px;overflow:hidden}
#hero svg{position:absolute;inset:0}
#htitle{left:36px;top:214px;font:700 42px/46px Cinzel,Georgia,serif;color:#f0e6d2;letter-spacing:2px;text-shadow:0 2px 8px #000}
#hdesc{left:36px;top:318px;width:310px;font:400 14px/20px Lato;color:#cdbe91;color:#d8d0bd;text-shadow:0 1px 4px #000}
.cta{left:36px;top:399px;width:137px;height:32px;border:2px solid var(--gold-d);background:rgba(1,10,19,.6);color:var(--gold);font:700 12px Lato;letter-spacing:1.5px}
/* cards */
.card{top:505px;height:134px;border:1px solid #1e2328;overflow:hidden;cursor:pointer;background:#0a1018}
.card:hover{border-color:var(--gold)}
.card img{width:100%;height:100%;object-fit:cover;display:block}.card svg{width:100%;height:100%;display:block}
.cl{top:648px;font:700 13px Lato;color:var(--hi);line-height:18px;cursor:pointer}
.cl:hover{color:#fff;text-decoration:underline}
.price{position:absolute;left:8px;bottom:8px;color:var(--hi);font:700 13px Lato;display:flex;gap:6px;align-items:center;text-shadow:0 1px 3px #000}
/* social */
#soc{left:1056px;top:80px;width:224px;height:640px;background:var(--bg);border-left:1px solid #1e2328}
#soc h4{left:25px;top:8px;font:700 12px Lato;letter-spacing:1.5px;color:var(--hi)}
.grp{left:25px;font:700 11px Lato;letter-spacing:1.5px;color:var(--txt);cursor:pointer;display:flex;gap:8px;align-items:center}
.grp:hover{color:var(--hi)}
.grp i{display:inline-block;transition:transform .15s;font-style:normal;font-size:8px}
.grp.open i{transform:rotate(90deg)}
#bot{left:1056px;top:686px;width:224px;height:34px;background:#0a1420;border-top:1px solid #1e2328}
.bb{top:688px;width:38px;height:30px;background:#1e2328;border:1px solid #3c3c41;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bb:hover{border-color:var(--gold)}
#ver{left:1190px;top:697px;font:700 11px Lato;color:#3c3c41}
#toast{left:50%;top:-40px;transform:translateX(-50%);padding:8px 18px;background:#1e2328;border:1px solid var(--gold-d);color:var(--hi);font-size:12px;transition:top .25s;z-index:9}
#toast.s{top:90px}
</style></head><body>

 <div id="toast" class="abs"></div>
</div>
<script>
const st=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);st.style.transform='scale('+s+')';st.style.left=(innerWidth-1280*s)/2+'px';st.style.top=(innerHeight-720*s)/2+'px'}
addEventListener('resize',fit);fit();
const t=document.getElementById('toast');let tm;
function toast(m){t.textContent=m;t.classList.add('s');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('s'),1400)}
function tabs(sel){document.querySelectorAll(sel).forEach(b=>b.onclick=()=>{document.querySelectorAll(sel).forEach(x=>x.classList.remove('on'));b.classList.add('on')})}
tabs('[data-n]');tabs('[data-s]');
document.querySelectorAll('[data-g]').forEach(g=>g.onclick=()=>g.classList.toggle('open'));
let q=false;const p=document.getElementById('play');
p.onclick=()=>{q=!q;p.classList.toggle('q',q);p.textContent=q?'CANCEL':'PLAY';toast(q?'Buscando partida…':'Búsqueda cancelada')};
document.getElementById('learn').onclick=()=>toast('Learn More');
document.getElementById('rot').onclick=()=>toast('Free Champion Rotation');
document.getElementById('info').onclick=()=>toast('Notificaciones');
document.getElementById('online').onclick=function(){const o=this.textContent.trim()==='Online';this.lastChild.textContent=o?'Away':'Online';this.style.color=o?'#e0a030':'#0ac86e';this.firstChild.style.background=o?'#e0a030':'#0ac86e'};
document.querySelectorAll('.card,.cl,.ic,.bb').forEach(e=>e.addEventListener('click',()=>toast('Botón presionado')));
</script></body></html>
