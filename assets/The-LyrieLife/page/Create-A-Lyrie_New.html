<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sims 4 – Crear un Sim</title>
<style>
:root{--w:#fff;--t:#3b4a56;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{height:100%;overflow:hidden;background:#20262b;font-family:"Segoe UI",Arial,sans-serif}
.st{position:absolute;width:474px;height:267px;transform-origin:0 0;overflow:hidden;display:none}
.st.on{display:block}
.a{position:absolute}
button{font:inherit;border:0;background:none;cursor:pointer}
/* screen 2 */
#s2{background:linear-gradient(90deg,#1c7cc4 0%,#2fa9d8 30%,#7fd2de 55%,#c9edf0 100%)}
.rb{border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff,#d9ecf4);border:1px solid #fff;box-shadow:0 0 0 1px #5aa8c8,0 1px 2px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rb:hover{background:#fff;box-shadow:0 0 0 1px #17a0d6,0 0 4px #fff}
.hex{width:15px;height:17px;background:linear-gradient(#e8f6fb,#bfe0ee);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;align-items:center;justify-content:center;color:#2b88b0;font:700 9px Arial;cursor:pointer}
.hex:hover{background:#fff}.hex.on{background:#fff6b0;color:#c78a00}
#name{left:4px;top:2px;width:96px;height:16px;border-radius:9px;background:linear-gradient(#fff,#cfe9f3);border:1px solid #fff;box-shadow:0 0 0 1px #4ea5c9;color:#2b6a8a;font:700 5.4px "Segoe UI",Arial;letter-spacing:.5px;display:flex;align-items:center;padding-left:8px;cursor:pointer}
.sl{width:1.5px;background:rgba(255,255,255,.75)}
.kn{width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bfe6f4);border:1px solid #fff;box-shadow:0 0 2px rgba(0,0,0,.4);cursor:grab}
.cat{width:15px;height:15px;border-radius:50%}
.cat.on{background:radial-gradient(circle at 40% 30%,#ffe8ee,#ff6f86);box-shadow:0 0 0 1px #fff,0 0 5px #fff}
#rp{left:318px;top:18px;width:124px;height:243px;background:#f7fafb;border-radius:3px;border:1px solid #fff;box-shadow:0 0 0 1px #6bb7d6,0 2px 6px rgba(0,0,0,.25)}
#sel{left:4px;top:30px;width:34px;height:9px;border:1px solid #6bb7d6;border-radius:2px;background:#fff;color:#2b6a8a;font:600 4.6px Arial;padding:1px 3px}
#ttl{right:7px;top:3px;font:700 5.5px Arial;color:#2b6a8a;letter-spacing:.6px}
#grid{left:2px;top:43px;width:115px;height:197px;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;scrollbar-width:none}
#grid::-webkit-scrollbar{display:none}
.tile{height:50px;border-radius:2px;border:1px solid rgba(0,0,0,.08);cursor:pointer;position:relative;transition:.1s}
.tile:hover{transform:scale(1.04);z-index:2;box-shadow:0 0 0 1px #fff,0 0 0 2px #17a0d6}
.tile.on{box-shadow:0 0 0 1px #fff,0 0 0 2.5px #f5a623}
#sb{right:1px;top:42px;width:3px;height:198px;background:#d6e6ec;border-radius:2px}
#sb i{display:block;width:3px;height:70px;background:#6bb7d6;border-radius:2px}
#tb{left:192px;top:250px;width:77px;height:16px;border-radius:9px 9px 0 0;background:linear-gradient(#f6fcff,#bfe0ee);border:1px solid #fff;box-shadow:0 0 0 1px #4ea5c9;display:flex;justify-content:space-around;align-items:center}
#tb i{width:7px;height:7px;background:#3f93b8;border-radius:2px;cursor:pointer}#tb i:hover{background:#fff;box-shadow:0 0 0 1px #3f93b8}
</style></head><body>
<div id="s2" class="st on">
 <div id="name" class="a">HELLO, MY NAME IS...</div>
 <div class="a hex" style="left:15px;top:23px" data-h>?</div><div class="a hex" style="left:34px;top:23px" data-h>?</div>
 <div class="a hex" style="left:10px;top:40px" data-h>?</div><div class="a hex" style="left:29px;top:40px" data-h>?</div><div class="a hex" style="left:48px;top:40px" data-h>?</div>
 <div class="a rb" style="left:68px;top:41px;width:14px;height:14px"><svg width="8" height="8"><path d="M1 4h6M4 1l3 3-3 3" stroke="#3f93b8" stroke-width="1.3" fill="none"/></svg></div>
 <div class="a rb" style="left:86px;top:44px;width:11px;height:11px"></div>
 <div class="a sl" style="left:104px;top:86px;height:46px"></div><div class="a sl" style="left:120px;top:86px;height:46px"></div>
 <div class="a kn" data-k style="left:101px;top:100px"></div><div class="a kn" data-k style="left:101px;top:116px"></div>
 <div class="a kn" data-k style="left:117px;top:100px"></div><div class="a kn" data-k style="left:117px;top:116px"></div>
 <div id="cats"></div>
 <svg class="a" style="left:128px;top:222px;cursor:pointer" width="34" height="26" viewBox="0 0 34 26"><path d="M30 6C16 2 6 8 5 18M5 18L2 11M5 18l7-3" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" transform="translate(0 1)"/></svg>
 <svg class="a" style="left:206px;top:222px;cursor:pointer" width="34" height="26" viewBox="0 0 34 26"><path d="M4 7C18 3 28 9 29 19M29 19l3-7M29 19l-7-3" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" transform="translate(0 0)"/></svg>
 <div class="a rb" style="left:401px;top:1px;width:18px;height:18px"><svg width="10" height="10"><circle cx="5" cy="5" r="3.5" fill="none" stroke="#3f93b8" stroke-width="1.4"/></svg></div>
 <div class="a rb" style="left:422px;top:1px;width:18px;height:18px"><svg width="10" height="10"><path d="M1 8l6-6M5 1l4 4" stroke="#3f93b8" stroke-width="1.4"/></svg></div>
 <div class="a rb" style="left:444px;top:1px;width:18px;height:18px"><svg width="10" height="10"><path d="M5 1v8M1 5h8" stroke="#3f93b8" stroke-width="1.4"/></svg></div>
 <svg class="a" style="left:319px;top:15px" width="10" height="16" viewBox="0 0 10 16"><path d="M5 0L10 8L5 16L0 8z" fill="#ffe14a" stroke="#fff" stroke-width=".8"/></svg>
 <div id="rp" class="a"><div id="sel" class="a">Female &#9662;</div><div id="ttl" class="a">TOPS</div><div id="grid" class="a"></div><div id="sb" class="a"><i></i></div></div>
 <div id="tb" class="a"><i></i><i></i><i></i><i></i><i></i></div>
 <svg class="a" style="left:5px;top:249px" width="30" height="16" viewBox="0 0 30 16"><circle cx="6" cy="4" r="3" fill="#fff"/><path d="M0 15c0-6 3-7 6-7s6 1 6 7z" fill="#fff"/><circle cx="20" cy="4" r="2.5" fill="#fff"/><path d="M15 15c0-5 2-6 5-6s5 1 5 6z" fill="#fff"/><path d="M27 8v6M24 11h6" stroke="#fff" stroke-width="1.4"/></svg>
 <div class="a rb" style="left:441px;top:246px;width:12px;height:12px"><svg width="7" height="7"><path d="M1 4l2 2 3-4" stroke="#3f93b8" stroke-width="1.3" fill="none"/></svg></div>
 <div class="a rb" style="left:456px;top:248px;width:14px;height:14px;background:radial-gradient(circle at 40% 30%,#c8f5c2,#43b84a)"><svg width="8" height="8"><path d="M1 4l2 2 4-4.5" stroke="#fff" stroke-width="1.6" fill="none"/></svg></div>
</div>

<script>
const W=474,H=267;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);document.querySelectorAll('.st').forEach(e=>{e.style.transform='scale('+s+')';e.style.left=(innerWidth-W*s)/2+'px';e.style.top=(innerHeight-H*s)/2+'px'})}
addEventListener('resize',fit);fit();
document.querySelectorAll('[data-h]').forEach(h=>h.onclick=()=>h.classList.toggle('on'));
/* category wheel */
const cats=document.getElementById('cats'),n=11,cx=215,cy=125,R=88;
const gl=['M3 3l3-2 3 2 2 2-2 2v6H3V7L1 5z','M2 1h8l-1 12H3z','M3 1h6v4l2 8H1l2-8z','M2 2h8v3H2zM3 5h6v8H3z','M3 1h6l1 6-2 6H4L2 7z','M1 12h4l1-4 2 4h3','M2 2l8 8M10 2L2 10','M1 7l5-5 5 5-5 5z','M3 3h6v6H3z','M2 11q4-9 8 0','M6 1v10M2 6h8'];
const sel=['tops'];
for(let i=0;i<n;i++){const a=(-62+i*(124/(n-1)))*Math.PI/180,x=cx+R*Math.sin(a),y=cy-R*Math.cos(a)+4;
const d=document.createElement('div');d.className='a rb cat'+(i==3?' on':'');d.style.cssText=`left:${(x+12).toFixed(1)}px;top:${(y).toFixed(1)}px`;
d.innerHTML=`<svg width="10" height="10" viewBox="0 0 12 14"><path d="${gl[i]}" fill="none" stroke="${i==3?'#fff':'#3f93b8'}" stroke-width="1.2"/></svg>`;
d.onclick=()=>{cats.querySelectorAll('.cat').forEach(c=>{c.classList.remove('on');c.querySelector('path').setAttribute('stroke','#3f93b8')});d.classList.add('on');d.querySelector('path').setAttribute('stroke','#fff')};cats.appendChild(d)}
/* color tiles */
const cols=['#ff5fa2','#f26a2e','#ff8a3d','#f7c600','#2fbf9b','#46b24a','#8a42d4','#2f7ddb','#9aa3ab','#232a31','#f5f5f5','#d9202f','#00b7c4','#a8d84a','#7a4a2a','#ff9eb5','#5b6ee1','#c2185b','#ffd9a0','#3b8a8a','#6d1f7a','#e8e05a'];
const g=document.getElementById('grid');
cols.forEach((c,i)=>{const t=document.createElement('div');t.className='tile'+(i==2?' on':'');t.style.background=`linear-gradient(160deg,${c},${c}cc)`;
t.onclick=()=>{g.querySelectorAll('.tile').forEach(x=>x.classList.remove('on'));t.classList.add('on')};g.appendChild(t)});
</script></body></html>
