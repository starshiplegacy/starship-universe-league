name: Repository and Supabase drift audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"

permissions:
  contents: read

concurrency:
  group: repository-drift-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Static assets and optional Supabase drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate audit script syntax
        run: python -m py_compile scripts/repo_audit.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          for file in account-settings.js app.js entitlements.js gallery.js games.js save-system.js supabase-config.js; do
            node --check "$file"
          done
          node --input-type=module --check < map-registry.js
      - name: Audit local references and backend configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_EXPECTED_PROJECT_REF: ${{ vars.SUPABASE_EXPECTED_PROJECT_REF }}
        run: python scripts/repo_audit.py
